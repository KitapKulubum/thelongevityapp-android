android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Java heap – OutOfMemoryError önlemi (Java 21 + Gradle 8.10 uyumlu)
org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true

# Kotlin daemon bağlantı hatasını önle: derlemeyi Gradle process içinde yap
kotlin.compiler.execution.strategy=in-process
